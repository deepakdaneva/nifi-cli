quarkus.banner.enabled=false
quarkus.log.level=OFF
quarkus.log.file.enabled=false
quarkus.log.console.enabled=true
quarkus.log.category."io.github.deepakdaneva".level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd'T'HH:mm:ss.SSSz} %-5p| %s%e%n
# Packaging: a single runnable target/nifi-cli.jar (same layout as the published 1.x artifact)
quarkus.package.jar.type=uber-jar
quarkus.package.jar.add-runner-suffix=false
quarkus.package.jar.filter-optional-dependencies=true
# Index the NiFi DTOs so their reflection metadata is registered for native builds
quarkus.index-dependency.nifi-client-dto.group-id=org.apache.nifi
quarkus.index-dependency.nifi-client-dto.artifact-id=nifi-client-dto
quarkus.rest-client.http2=true
# CLI parsing behaviour
io.github.deepakdaneva.nifi.cli.stop-at-unmatched=false
io.github.deepakdaneva.nifi.cli.unmatched-arguments-allowed=false
